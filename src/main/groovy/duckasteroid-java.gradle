import org.gradle.api.JavaVersion
import org.gradle.api.publish.maven.MavenPublication

plugins {
    id 'java'
    id 'maven-publish'
    id 'signing'
    id 'pl.allegro.tech.build.axion-release'
    id 'com.github.ben-manes.versions'
    id 'io.github.duckasteroid.github-packages'
}

// Java toolchain version, overridable via -Pduckasteroid.java.version or gradle.properties
def javaToolchainVersion = (project.findProperty('duckasteroid.java.version') ?: '25') as int
java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(javaToolchainVersion))
    }
}

// Multi-project friendly versioning strategy
scmVersion {
    tag {
        // define a custom prefix for this project based on Gradle path
        def customPrefix = "${project.path.replace(':','/')}/v"
        while (customPrefix.startsWith("/")) {
            customPrefix = customPrefix.substring(1)
        }
        println("Project '${project.name}' custom prefix: ${customPrefix}")
        // Expect this prefix for this project
        prefix.set(customPrefix)
        // Fallback onto root project versions
        fallbackPrefixes.set(['v'])
        // Absolute default
        initialVersion({config, position -> "0.0.0+notag"})
    }
}

version = scmVersion.version

group = 'io.github.duckasteroid'

// get dependencies from maven central
repositories {
    mavenCentral()
    mavenLocal()
}

// Publishing to Maven central requires javadoc and source JARs
java {
    withJavadocJar()
    withSourcesJar()
}

// HTML5 javadocs
javadoc {
    if(JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption('html5', true)
    }
}

// add the source and javadoc JARs to the artifact list
artifacts {
    archives javadocJar, sourcesJar
}



// Configure the publication so that all appropriate meta data ends up in the POM
// as required by Maven central
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = project.name
                //description = "Project ${getProject().path}"
                url = "http://duckasteroid.github.io/${rootProject.name}/"
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                scm {
                    connection = "scm:git:git://github.com/duckAsteroid/${rootProject.name}.git"
                    developerConnection = "scm:git:ssh://github.com:duckAsteroid/${rootProject.name}.git"
                    url ="https://github.com/duckAsteroid/${rootProject.name}/tree/master"
                }
                developers {
                    developer {
                        id = 'duckAsteroid'
                        name = 'Chris Senior'
                        email ='christopher.senior@gmail.com'
                    }
                }
            }
        }
    }
    // add the Maven OSSRH repositories
    repositories {
        maven {
            name = 'OSSRH'
            // Release and snapshots have different URLs
            def releasesRepoUrl = 'https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/'
            def snapshotsRepoUrl = 'https://s01.oss.sonatype.org/content/repositories/snapshots/'
            url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
            // use project properties to pick up user/pass for repo
            credentials {
                username = project.hasProperty('ossrhUsername') ?  ossrhUsername : "undefined"
                password = project.hasProperty('ossrhPassword') ?  ossrhPassword : "undefined"
            }
        }
        gitHubPackages {
            owner = "duckAsteroid"
            repo = rootProject.name
        }
    }
}

// All JARs published to Maven central must be signed
signing {
    sign publishing.publications.mavenJava
}
