// Opt-in: publish to duckAsteroid's own GitHub Packages feed. Apply alongside
// 'duckasteroid-java', which must apply first (creates the mavenJava publication).
plugins {
    id 'io.github.duckasteroid.github-packages'
}

publishing {
    repositories {
        gitHubPackages {
            owner = "duckAsteroid"
            repo = rootProject.name
        }
    }
}
