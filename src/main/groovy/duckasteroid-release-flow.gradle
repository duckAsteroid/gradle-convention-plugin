import org.gradle.api.Project
import org.gradle.api.plugins.JavaPluginExtension
import io.github.duckasteroid.conventions.ChangelogExtension
import io.github.duckasteroid.conventions.ChangelogGenerator
import io.github.duckasteroid.conventions.ChangelogScope
import io.github.duckasteroid.conventions.CommitAnalyzerExtension
import io.github.duckasteroid.conventions.ReleaseCandidatesExtension
import io.github.duckasteroid.conventions.ReleaseGitOps
import io.github.duckasteroid.conventions.ReleaseManifest
import io.github.duckasteroid.conventions.VersionReport
import io.github.duckasteroid.conventions.VersionReportExtension
import io.github.duckasteroid.conventions.VersionResolver
import io.github.duckasteroid.conventions.ManagedFileChecker
import io.github.duckasteroid.conventions.ManagedFileInstaller

// Opt-in release-engineering tasks for the develop -> release -> main flow described in
// VERSIONING.md at the repo root. Apply alongside duckasteroid-version, which computes
// project.ext.tagPrefix / project.ext.modulePath that these tasks reuse rather than recomputing -
// duckasteroid-java applies duckasteroid-version internally, so applying duckasteroid-java also
// satisfies this. installReleaseWorkflows is the one task with a real, separate java-toolchain
// dependency of its own (see its own comment further down) - every other task here only needs
// duckasteroid-version.
//
// Ten tasks total. tagReleaseCandidate/promoteReleaseCandidate are the release-time counterpart
// to duckasteroid-version's ordinary-build version resolution (they don't just *compute* a version,
// they actually create and push a tag for it) for the applying project alone - handy for local,
// single-module work. tagReleaseCandidates/promoteReleaseCandidates (plural - see below) are what
// CI actually calls: they loop every project in the build that applies duckasteroid-release-flow,
// so the same mechanism covers a single-module repo, several independently-versioned modules, or a
// shared root version, without any of those shapes needing special-case configuration - see
// MULTI_MODULE_RELEASE_FLOW.md. changelogForReleaseCandidate/changelogForRelease generate release
// notes for the applying project alone (see below); explainVersion/explainVersions (see issue #5,
// further down) print (and, by default, write to build/version-report.json) a read-only preview of
// what tagReleaseCandidate(s) would actually do right now, without tagging or pushing anything;
// installReleaseWorkflows/checkReleaseWorkflows (see issue #2, further down) install/verify the
// GitHub Actions workflow files that invoke the plural tasks above. All ten are plain Gradle tasks,
// runnable locally as well as from CI - release engineering shouldn't hard-depend on GitHub Actions
// being up. This repo's own .github/workflows/*.yml are a human-readable reference for what
// installReleaseWorkflows installs (see VERSIONING.md) - this repo can't apply its own plugins to
// itself, so they're not literally produced by that task here.
//
// tagReleaseCandidate/promoteReleaseCandidate respect release.forceVersion as the ultimate backstop,
// same as the ordinary build version resolution in duckasteroid-version: if set, it's used verbatim,
// no commit analysis runs at all. This check is deliberately repeated here rather than shared with
// duckasteroid-version.gradle, so the backstop can never be silently bypassed by one call site
// forgetting to check it. See
// https://axion-release-plugin.readthedocs.io/en/latest/configuration/force_version/
// (The changelog tasks have no forceVersion equivalent - release notes are generated from whatever
// commits are actually there regardless of what version they're attached to.) The plural aggregator
// tasks respect the same property, applying it as a literal version to every project they loop over
// - a deliberately blunt "release everything with this exact number" manual override, not a
// per-project one.
//
// Task actions below capture everything they need (tagPrefix, modulePath, projectDir, the
// forceVersion property) as plain local values during task *configuration*, and shell out via
// plain ProcessBuilder rather than project.exec at *execution* time (inside doLast) - accessing the
// live Project object from a task action at execution time is unsupported under the configuration
// cache, so nothing in a doLast block below may reference `project` directly. The plural aggregator
// tasks below follow the same rule: the list of applying projects is captured as plain data (File/
// String/Map values, never live Project references) from a gradle.projectsEvaluated callback, which
// runs at configuration time, not from inside their own doLast blocks.
//
// changelogForReleaseCandidate / changelogForRelease (see the `changelog { }` extension below)
// generate release notes but don't tag anything - deliberately separate from tagReleaseCandidate/
// promoteReleaseCandidate so notes can be previewed locally before actually cutting a release, and
// so a CI job can generate notes, then tag, in that order (changelogForReleaseCandidate must run
// BEFORE tagReleaseCandidate: it looks for the *previous* release-candidate tag reachable from HEAD,
// which would incorrectly find the *new* RC tag instead if that tag already existed by the time it
// ran). The plural aggregator tasks generate each project's changelog internally, in the same order,
// as part of their own doLast - a CI job calling them doesn't need a separate changelog step first.
//
// releaseCandidates { } (see the extension below and VERSIONING.md's "Pruning superseded release
// candidates") controls what tagReleaseCandidate(s) does once a new RC exists for a module: release
// candidates aren't permanent, so by default every previous RC's GitHub Release (never its tag or
// published package) is deleted, regardless of whether the candidate version itself changed
// mid-cycle. tagReleaseCandidates records what got superseded per module in each
// build/release-manifest.json entry's supersededTags field for the CI workflow to act on;
// tagReleaseCandidate (singular) only prints the leapfrog warning below, since it has no GitHub
// integration point of its own to prune anything through. promoteReleaseCandidate(s) never prunes -
// by the time a promotion happens there's only ever one live RC for that module left to promote.

def changelogExtension = project.extensions.create('changelog', ChangelogExtension)
changelogExtension.rcScope.convention(ChangelogScope.SINCE_LAST_RELEASE)

def releaseCandidatesExtension = project.extensions.create('releaseCandidates', ReleaseCandidatesExtension)
releaseCandidatesExtension.pruneSuperseded.convention(true)
releaseCandidatesExtension.retain.convention(0)

def versionReportExtension = project.extensions.create('versionReport', VersionReportExtension)
versionReportExtension.enabled.convention(true)
versionReportExtension.outputFile.convention(project.layout.buildDirectory.file('version-report.json'))

tasks.register('tagReleaseCandidate') {
    group = 'release'
    description = 'Tags and pushes the next release-candidate version (auto-incrementing RC number), ' +
            'derived from conventional commits since the last final release, or release.forceVersion if set.'
    def tagPrefix = project.ext.tagPrefix
    def modulePath = project.ext.modulePath
    def repoDir = project.projectDir
    def forceVersion = project.findProperty('release.forceVersion')
    // Captured now (configuration time) as a plain Map, not the live extension object - see the
    // config-cache note in the file-level comment above.
    def typeRules = project.extensions.getByType(CommitAnalyzerExtension).toTypeRules()
    doLast {
        // Same candidate computation as an ordinary build (VersionResolver.resolveCandidateVersion,
        // sharing the fallback-to-root-'v' and path-scoped commit-filtering behavior), just without
        // the -SNAPSHOT decoration - this candidate is what actually gets tagged below, not just
        // displayed. Intended to run on every push to the `release` branch: the first invocation for
        // a given candidate version mints "-RC1", subsequent ones on later commits mint "-RC2",
        // "-RC3", etc. (see VersionResolver.nextReleaseCandidateTag), with no manual version
        // bookkeeping required anywhere.
        String candidate = forceVersion ?:
                VersionResolver.resolveCandidateVersion(repoDir, tagPrefix, modulePath, ['v'], typeRules)
        // Release candidates aren't permanent - a later commit can raise the bump mid-cycle and
        // "leapfrog" straight past whatever the most recent RC's version was (e.g. v1.4.0-RC3
        // followed by v1.4.1-RC1). Never blocks, just flags it - see releaseCandidates { } below
        // for what tagReleaseCandidates (the plural aggregator) does about the superseded RC's
        // GitHub Release once this happens.
        List<String> currentCycleTags = VersionResolver.currentCycleReleaseCandidateTags(repoDir, tagPrefix, ['v'])
        if (!currentCycleTags.isEmpty()) {
            String previousVersion = currentCycleTags[0].substring(tagPrefix.length()).replaceAll(/-RC\d+$/, '')
            if (previousVersion != candidate) {
                logger.warn("tagReleaseCandidate: candidate jumped from ${tagPrefix}${previousVersion} to " +
                        "${tagPrefix}${candidate} - new qualifying commits raised the bump since ${currentCycleTags[0]}")
            }
        }
        String tag = VersionResolver.nextReleaseCandidateTag(repoDir, tagPrefix, candidate)
        ReleaseGitOps.createAndPushTag(repoDir, tag)
    }
}

tasks.register('promoteReleaseCandidate') {
    group = 'release'
    description = 'Strips the -RCx suffix off the current release candidate and tags/pushes the final ' +
            'release version, or release.forceVersion if set.'
    def tagPrefix = project.ext.tagPrefix
    def repoDir = project.projectDir
    def forceVersion = project.findProperty('release.forceVersion')
    doLast {
        // No modulePath/fallback needed here, unlike tagReleaseCandidate above: this doesn't derive
        // a version from commits at all, it just strips "-RCn" off whichever RC tag is nearest
        // reachable from HEAD (VersionResolver.promoteTag) - by the time you're promoting, that tag
        // already exists, already under this module's own tagPrefix. Intended to run on every push
        // to `main` once an accepted RC has been merged there from `release`.
        String tag = forceVersion ? "${tagPrefix}${forceVersion}" : VersionResolver.promoteTag(repoDir, tagPrefix)
        ReleaseGitOps.createAndPushTag(repoDir, tag)
    }
}

tasks.register('changelogForReleaseCandidate') {
    group = 'release'
    description = 'Generates release-candidate notes (Markdown, written to build/changelog.md), ' +
            'scoped by changelog.rcScope (default: everything since the last final release).'
    def tagPrefix = project.ext.tagPrefix
    def modulePath = project.ext.modulePath
    def repoDir = project.projectDir
    def typeRules = project.extensions.getByType(CommitAnalyzerExtension).toTypeRules()
    def rcScope = project.extensions.getByType(ChangelogExtension).rcScope.get()
    def outputFile = project.layout.buildDirectory.file('changelog.md').get().asFile
    doLast {
        List<String> messages = VersionResolver.commitMessagesForChangelog(repoDir, tagPrefix, modulePath, ['v'], rcScope)
        ReleaseGitOps.writeChangelog(outputFile, ChangelogGenerator.generate(messages, typeRules))
    }
}

tasks.register('changelogForRelease') {
    group = 'release'
    description = 'Generates final release notes (Markdown, written to build/changelog.md), covering ' +
            'everything since the last final release regardless of changelog.rcScope.'
    def tagPrefix = project.ext.tagPrefix
    def modulePath = project.ext.modulePath
    def repoDir = project.projectDir
    def typeRules = project.extensions.getByType(CommitAnalyzerExtension).toTypeRules()
    def outputFile = project.layout.buildDirectory.file('changelog.md').get().asFile
    doLast {
        List<String> messages = VersionResolver.commitMessagesForChangelog(
                repoDir, tagPrefix, modulePath, ['v'], ChangelogScope.SINCE_LAST_RELEASE)
        ReleaseGitOps.writeChangelog(outputFile, ChangelogGenerator.generate(messages, typeRules))
    }
}

tasks.register('explainVersion') {
    group = 'release'
    description = 'Prints a breakdown of how this project\'s next release-candidate version would be ' +
            'computed right now (and, by default, writes it to build/version-report.json) - read-only, ' +
            'never tags or pushes anything. See versionReport { } to control the JSON file.'
    def module = project.path
    def tagPrefix = project.ext.tagPrefix
    def modulePath = project.ext.modulePath
    def repoDir = project.projectDir
    def forceVersion = project.findProperty('release.forceVersion')
    def typeRules = project.extensions.getByType(CommitAnalyzerExtension).toTypeRules()
    def reportEnabled = versionReportExtension.enabled.get()
    def reportFile = versionReportExtension.outputFile.get().asFile
    doLast {
        // No excludedModulePaths - same as the ordinary-build version resolution and the singular
        // tagReleaseCandidate above, sibling-exclusion is a multi-module-aggregator-only concern
        // (see releaseFlowTargets and issue #8).
        String branch = ReleaseGitOps.currentBranch(repoDir)
        VersionReport.Entry entry = VersionReport.buildEntry(
                module, repoDir, tagPrefix, modulePath, ['v'], typeRules, [], forceVersion, branch)
        println entry.render()
        if (reportEnabled) {
            entry.writeTo(reportFile)
            println "explainVersion: wrote ${reportFile}"
        }
    }
}

// tagReleaseCandidates / promoteReleaseCandidates (see MULTI_MODULE_RELEASE_FLOW.md for the full
// design): the plural, multi-module-aware counterparts to the two singular tasks above. Registered
// exactly once, on rootProject, no matter which (or how many) projects apply
// duckasteroid-release-flow - Gradle's own unqualified `./gradlew <taskName>` matching already runs
// a same-named task in *every* project that defines it, so registering these the same way as the
// singular tasks above (once per applying project) would mean several independent aggregator
// instances all running from one invocation, each redoing the full enumerate/skip/tag/manifest-write
// cycle and racing on the same build/release-manifest.json - the exact bug these tasks exist to fix,
// just moved up one level. The `rootProject.tasks.findByName(...) == null` guard below makes the
// first applying project's script win; every subsequent one is a no-op.
//
// The list of applying projects is captured once, from rootProject.gradle.projectsEvaluated
// (fires after every project in the build has finished configuring, regardless of which one applied
// duckasteroid-release-flow first or last) as plain data - File/String/Map values only, no live
// Project references - and closed over by the task's doLast block. Building that list inside doLast
// itself instead would mean touching live Project objects at task *execution* time, which is
// unsupported under the configuration cache (see the file-level comment above).
if (rootProject.tasks.findByName('tagReleaseCandidates') == null) {
    def manifestFile = rootProject.layout.buildDirectory.file('release-manifest.json').get().asFile
    def rootDir = rootProject.projectDir
    def forceVersion = rootProject.findProperty('release.forceVersion')
    def aggregator = rootProject.tasks.register('tagReleaseCandidates') {
        group = 'release'
        description = 'Loops every project applying duckasteroid-release-flow, tags/pushes the next ' +
                'release-candidate (and generates its changelog) for each one with qualifying commits ' +
                'since its last release, skips the rest, and writes build/release-manifest.json for CI ' +
                'to turn into GitHub Releases. Registered once on the root project regardless of which ' +
                'project(s) apply duckasteroid-release-flow - see MULTI_MODULE_RELEASE_FLOW.md.'
    }
    rootProject.gradle.projectsEvaluated {
        List<Map> targets = releaseFlowTargets(rootProject)
        aggregator.configure {
            doLast {
                ReleaseManifest manifest = new ReleaseManifest()
                targets.each { target ->
                    File projectDir = target.projectDir as File
                    String tagPrefix = target.tagPrefix as String
                    String modulePath = target.modulePath as String
                    Map typeRules = target.typeRules as Map
                    // Precomputed at configuration time by releaseFlowTargets - see its doc comment
                    // and issue #8.
                    List<String> excludedModulePaths = target.excludedModulePaths as List<String>
                    String candidate = forceVersion ?: VersionResolver.resolveCandidateVersion(
                            projectDir, tagPrefix, modulePath, ['v'], typeRules, excludedModulePaths)
                    String lastFinal = VersionResolver.lastFinalVersion(projectDir, tagPrefix, ['v'])
                    if (candidate == lastFinal) {
                        println "tagReleaseCandidates: skipping ${target.module} - no qualifying commits since ${tagPrefix}${lastFinal}"
                        return
                    }
                    // Release candidates aren't permanent - a later commit can raise the bump
                    // mid-cycle and "leapfrog" straight past whatever the most recent RC's version
                    // was (e.g. v1.4.0-RC3 followed by v1.4.1-RC1). Never blocks, just flags it.
                    List<String> currentCycleTags = VersionResolver.currentCycleReleaseCandidateTags(projectDir, tagPrefix, ['v'])
                    if (!currentCycleTags.isEmpty()) {
                        String previousVersion = currentCycleTags[0].substring(tagPrefix.length()).replaceAll(/-RC\d+$/, '')
                        if (previousVersion != candidate) {
                            logger.warn("tagReleaseCandidates: ${target.module} candidate jumped from ${tagPrefix}${previousVersion} " +
                                    "to ${tagPrefix}${candidate} - new qualifying commits raised the bump since ${currentCycleTags[0]}")
                        }
                    }
                    List<String> messages = VersionResolver.commitMessagesForChangelog(
                            projectDir, tagPrefix, modulePath, ['v'], target.rcScope as ChangelogScope, excludedModulePaths)
                    File changelogFile = target.changelogFile as File
                    ReleaseGitOps.writeChangelog(changelogFile, ChangelogGenerator.generate(messages, typeRules))
                    String tag = VersionResolver.nextReleaseCandidateTag(projectDir, tagPrefix, candidate)
                    ReleaseGitOps.createAndPushTag(projectDir, tag)
                    // Every current-cycle RC (regardless of which candidate version it was minted
                    // under - see currentCycleReleaseCandidateTags) is superseded by the one just
                    // tagged, except however many the releaseCandidates { } extension says to
                    // retain. Only the GitHub Release gets deleted (by the CI workflow, from this
                    // manifest entry) - the tag and its published package are left alone.
                    boolean pruneSuperseded = target.pruneSuperseded as boolean
                    int retain = target.retain as int
                    List<String> supersededTags = pruneSuperseded ? currentCycleTags.drop(retain) : []
                    // A directory to glob at workflow time, not literal jar/sources/javadoc file
                    // names: project.version (and therefore every Jar task's output file name) was
                    // already fixed at *configuration* time of this same invocation, before the tag
                    // above existed - it's still the ordinary-build "-SNAPSHOT" value, not the
                    // release version just minted. The files actually published under that release
                    // version only exist once a *later*, separate `./gradlew` invocation re-resolves
                    // project.version against the now-pushed tag (see VersionResolver.exactTagAt) -
                    // so the workflow has to build then glob this directory, rather than the manifest
                    // predicting exact file names it can't yet know.
                    String artifactsDir = ReleaseGitOps.relativePath(rootDir, target.libsDir as File)
                    manifest.add(target.module as String, tag, ReleaseGitOps.relativePath(rootDir, changelogFile), supersededTags, artifactsDir)
                }
                manifest.writeTo(manifestFile)
                println "tagReleaseCandidates: wrote ${manifestFile} (${manifest.size()} ${manifest.size() == 1 ? 'entry' : 'entries'})"
            }
        }
    }
}

if (rootProject.tasks.findByName('promoteReleaseCandidates') == null) {
    def manifestFile = rootProject.layout.buildDirectory.file('release-manifest.json').get().asFile
    def rootDir = rootProject.projectDir
    def forceVersion = rootProject.findProperty('release.forceVersion')
    def aggregator = rootProject.tasks.register('promoteReleaseCandidates') {
        group = 'release'
        description = 'Loops every project applying duckasteroid-release-flow, promotes each one\'s ' +
                'nearest reachable release-candidate to a final release (generating its release notes ' +
                'first), skips projects with no pending RC, and writes build/release-manifest.json for ' +
                'CI to turn into GitHub Releases. Registered once on the root project - see ' +
                'MULTI_MODULE_RELEASE_FLOW.md.'
    }
    rootProject.gradle.projectsEvaluated {
        List<Map> targets = releaseFlowTargets(rootProject)
        aggregator.configure {
            doLast {
                ReleaseManifest manifest = new ReleaseManifest()
                targets.each { target ->
                    File projectDir = target.projectDir as File
                    String tagPrefix = target.tagPrefix as String
                    String tag
                    try {
                        tag = forceVersion ? "${tagPrefix}${forceVersion}" : VersionResolver.promoteTag(projectDir, tagPrefix)
                    } catch (IllegalStateException ignored) {
                        println "promoteReleaseCandidates: skipping ${target.module} - no release-candidate tag reachable from HEAD"
                        return
                    }
                    // Must run BEFORE createAndPushTag below - see the file-level comment on
                    // changelogForRelease/changelogForReleaseCandidate ordering. Same precomputed
                    // sibling exclusion as tagReleaseCandidates above - see releaseFlowTargets and
                    // issue #8.
                    List<String> messages = VersionResolver.commitMessagesForChangelog(
                            projectDir, tagPrefix, target.modulePath as String, ['v'],
                            ChangelogScope.SINCE_LAST_RELEASE, target.excludedModulePaths as List<String>)
                    File changelogFile = target.changelogFile as File
                    ReleaseGitOps.writeChangelog(changelogFile, ChangelogGenerator.generate(messages, target.typeRules as Map))
                    ReleaseGitOps.createAndPushTag(projectDir, tag)
                    // See the matching comment in tagReleaseCandidates above for why this is a
                    // directory to glob rather than literal artifact file names.
                    String artifactsDir = ReleaseGitOps.relativePath(rootDir, target.libsDir as File)
                    manifest.add(target.module as String, tag, ReleaseGitOps.relativePath(rootDir, changelogFile), [], artifactsDir)
                }
                manifest.writeTo(manifestFile)
                println "promoteReleaseCandidates: wrote ${manifestFile} (${manifest.size()} ${manifest.size() == 1 ? 'entry' : 'entries'})"
            }
        }
    }
}

// explainVersions (see issue #5): the read-only, multi-module-aware preview counterpart to
// tagReleaseCandidates - same releaseFlowTargets/root-registration mechanism, same skip/tag decision
// (candidate == lastFinal), but never tags, pushes, or mints anything. versionReport { } is read from
// whichever applying project's script wins the registration guard below (normally root), same
// "first applying project decides" rule installReleaseWorkflows already uses for its Java-toolchain
// substitution - not a new, second rule.
if (rootProject.tasks.findByName('explainVersions') == null) {
    def forceVersion = rootProject.findProperty('release.forceVersion')
    def reportEnabled = versionReportExtension.enabled.get()
    def reportFile = versionReportExtension.outputFile.get().asFile
    def aggregator = rootProject.tasks.register('explainVersions') {
        group = 'release'
        description = 'Loops every project applying duckasteroid-release-flow and prints a breakdown ' +
                'of how each one\'s next release-candidate version would be computed right now (and, by ' +
                'default, writes them to build/version-report.json) - the read-only preview counterpart ' +
                'to tagReleaseCandidates. Registered once on the root project regardless of which ' +
                'project(s) apply duckasteroid-release-flow - see MULTI_MODULE_RELEASE_FLOW.md.'
    }
    rootProject.gradle.projectsEvaluated {
        List<Map> targets = releaseFlowTargets(rootProject)
        aggregator.configure {
            doLast {
                List<VersionReport.Entry> entries = []
                targets.each { target ->
                    File projectDir = target.projectDir as File
                    String tagPrefix = target.tagPrefix as String
                    String modulePath = target.modulePath as String
                    Map typeRules = target.typeRules as Map
                    List<String> excludedModulePaths = target.excludedModulePaths as List<String>
                    String branch = ReleaseGitOps.currentBranch(projectDir)
                    VersionReport.Entry entry = VersionReport.buildEntry(target.module as String, projectDir,
                            tagPrefix, modulePath, ['v'], typeRules, excludedModulePaths, forceVersion, branch)
                    // Same skip/tag decision as tagReleaseCandidates above - see its own doLast - so
                    // this preview can never disagree with what tagging would actually do.
                    if (entry.candidate == entry.lastFinal) {
                        entry.action = 'SKIP'
                        entry.reason = "no qualifying commits since ${tagPrefix}${entry.lastFinal}"
                    } else {
                        entry.action = 'TAG'
                        entry.reason = "would mint ${entry.nextReleaseCandidateTag}"
                    }
                    println "explainVersions: ${target.module} - ${entry.action} (${entry.reason})"
                    entries << entry
                }
                entries.each { println it.render() }
                if (reportEnabled) {
                    VersionReport.writeJsonArray(entries, reportFile)
                    println "explainVersions: wrote ${reportFile} (${entries.size()} ${entries.size() == 1 ? 'entry' : 'entries'})"
                }
            }
        }
    }
}

// installReleaseWorkflows / checkReleaseWorkflows (see issue #2): install/verify a consumer's
// release-candidate.yml/promote-release.yml GitHub Actions workflows, with staleness detection so
// a consumer can tell whether their installed copy still matches what this plugin version would
// install. Both bundle the same release-candidate.yml/promote-release.yml as plugin resources
// (src/main/resources/io/github/duckasteroid/conventions/workflows/), templating the one variable
// bit (the Java toolchain version) at install time via a plain '@@JAVA_VERSION@@' placeholder -
// deliberately NOT Gradle's expand()/GString syntax, since the workflow YAML itself contains live
// '${{ github.token }}'-style GitHub Actions expressions that must survive untouched.
//
// There is exactly one workflow pair per repository, regardless of how many projects apply
// duckasteroid-release-flow - like the plural tasks above, these are registered once on rootProject,
// guarded the same way, so applying the plugin to several subprojects doesn't try to install the
// same files several times over. The Java toolchain substituted into the template comes from
// whichever project's script wins the guard (normally root, if root applies duckasteroid-java) -
// see MULTI_MODULE_RELEASE_FLOW.md's "Installing the workflows" section for the current limitation
// this implies if applying projects use differing toolchain versions. This is the one place in this
// file that genuinely needs a java-toolchain-configuring plugin present (JavaPluginExtension,
// below) - every other task here only needs duckasteroid-version, not duckasteroid-java specifically.
//
// ManagedFileInstaller/ManagedFileChecker (plain Groovy classes, no Gradle dependency, unit-tested
// directly) do the actual marker/hash comparison - see ManagedFileMarker's doc comment for the
// skip/overwrite rules. Resource bytes and the toolchain version are read at configuration time
// (loadWorkflowResource() below, plus java.toolchain) and captured as plain local values, same
// config-cache-safe pattern as the rest of this file: doLast blocks below never touch `project`.
if (rootProject.tasks.findByName('installReleaseWorkflows') == null) {
    def workflowsDir = new File(rootProject.projectDir, '.github/workflows')
    // findByType, not getByType: duckasteroid-release-flow itself must stay applicable with only
    // duckasteroid-version present (see the file-level comment above) - a project with no
    // java-toolchain-configuring plugin at all simply has no JavaPluginExtension to read, and that
    // must not crash *applying the plugin*. javaVersion ends up null in that case; the actual
    // failure (a clear, deliberate one, not a mystifying UnknownDomainObjectException) is deferred
    // to installReleaseWorkflows' own doLast, below - the one task that genuinely can't proceed
    // without it.
    def javaToolchain = project.extensions.findByType(JavaPluginExtension)
    def javaVersion = javaToolchain?.toolchain?.languageVersion?.get()?.toString()
    def force = rootProject.hasProperty('duckasteroid.workflows.force')
    def pluginVersion = loadWorkflowResource('workflow-version.txt').trim()
    def templates = [
            'release-candidate.yml': loadWorkflowResource('release-candidate.yml'),
            'promote-release.yml'  : loadWorkflowResource('promote-release.yml'),
    ]
    rootProject.tasks.register('installReleaseWorkflows') {
        group = 'release'
        description = 'Installs the release-candidate/promote-release GitHub Actions workflows bundled with ' +
                'this plugin into .github/workflows/, without clobbering files edited since a previous install ' +
                '(use -Pduckasteroid.workflows.force=true to override). Registered once on the root project ' +
                'regardless of which project(s) apply duckasteroid-release-flow.'
        doLast {
            if (javaVersion == null) {
                throw new GradleException('installReleaseWorkflows needs a java-toolchain-configuring plugin ' +
                        '(e.g. duckasteroid-java) applied somewhere in this build, to know what Java version to ' +
                        'put in the installed workflows\' setup-java step - duckasteroid-version alone is not ' +
                        'enough for this one task.')
            }
            templates.each { fileName, template ->
                String body = template.replace('@@JAVA_VERSION@@', javaVersion)
                File target = new File(workflowsDir, fileName)
                ManagedFileInstaller.Result result = ManagedFileInstaller.install(target, 'release-flow', pluginVersion, body, force)
                switch (result) {
                    case ManagedFileInstaller.Result.INSTALLED:
                    case ManagedFileInstaller.Result.OVERWRITTEN:
                    case ManagedFileInstaller.Result.FORCED:
                        println "installReleaseWorkflows: wrote ${target} (${result})"
                        break
                    case ManagedFileInstaller.Result.UP_TO_DATE:
                        println "installReleaseWorkflows: ${target} already up to date"
                        break
                    case ManagedFileInstaller.Result.SKIPPED_FOREIGN:
                        logger.warn("installReleaseWorkflows: skipped ${target} - no duckasteroid marker found " +
                                "(foreign or hand-written file); not overwriting it.")
                        break
                    case ManagedFileInstaller.Result.SKIPPED_MODIFIED:
                        logger.warn("installReleaseWorkflows: skipped ${target} - edited since install (its body " +
                                "no longer matches its marker hash); not overwriting it. Re-run with " +
                                "-Pduckasteroid.workflows.force=true to discard those edits and take the new version.")
                        break
                }
            }
        }
    }
}

if (rootProject.tasks.findByName('checkReleaseWorkflows') == null) {
    def workflowsDir = new File(rootProject.projectDir, '.github/workflows')
    def pluginVersion = loadWorkflowResource('workflow-version.txt').trim()
    def fileNames = ['release-candidate.yml', 'promote-release.yml']
    rootProject.tasks.register('checkReleaseWorkflows') {
        group = 'release'
        description = 'Warns (never fails) if the installed release workflows are missing, unmarked, edited ' +
                'since install, or older than the currently applied duckasteroid-release-flow version. Not ' +
                'wired into build/check, so it never adds noise to an ordinary CI run. Registered once on the ' +
                'root project regardless of which project(s) apply duckasteroid-release-flow.'
        doLast {
            fileNames.each { fileName ->
                File target = new File(workflowsDir, fileName)
                ManagedFileChecker.CheckResult result = ManagedFileChecker.check(target, 'release-flow', pluginVersion)
                switch (result.status) {
                    case ManagedFileChecker.Status.UP_TO_DATE:
                        println "checkReleaseWorkflows: ${target} is up to date (${pluginVersion})"
                        break
                    case ManagedFileChecker.Status.MISSING:
                        logger.warn("checkReleaseWorkflows: ${target} does not exist - run installReleaseWorkflows to install it.")
                        break
                    case ManagedFileChecker.Status.NOT_OURS:
                        logger.warn("checkReleaseWorkflows: ${target} has no duckasteroid marker - it wasn't installed by installReleaseWorkflows.")
                        break
                    case ManagedFileChecker.Status.TAMPERED:
                        logger.warn("checkReleaseWorkflows: ${target} has been edited since install (its body no " +
                                "longer matches its marker hash from version ${result.installedVersion}).")
                        break
                    case ManagedFileChecker.Status.STALE:
                        logger.warn("checkReleaseWorkflows: ${target} was installed from duckasteroid-release-flow " +
                                "${result.installedVersion}, but ${pluginVersion} is currently applied - run " +
                                "installReleaseWorkflows to update it.")
                        break
                }
            }
        }
    }
}

/**
 * Every project in root's build that has duckasteroid-release-flow applied, as plain data (File/
 * String/Map values only, never live Project references - see the file-level comment above for why)
 * for the plural aggregator tasks to loop over. Must be called from a configuration-time hook (e.g.
 * rootProject.gradle.projectsEvaluated) after every project has finished applying its plugins, not
 * from inside a task's doLast.
 *
 * Each target's map also carries its own excludedModulePaths: every OTHER target's modulePath (see
 * MULTI_MODULE_RELEASE_FLOW.md's "mixed mode" and issue #8 - without this, root's modulePath ""
 * would also bump/release on a commit that's entirely a sibling's own independently-versioned
 * subproject; harmless for siblings not actually nested under this target's own modulePath, since
 * excluding a directory this target's include-path never reached in the first place is a no-op). A
 * sibling's own empty-string root modulePath is naturally dropped by VersionResolver's blank-string
 * filtering when it shows up here as someone else's exclusion, so no special-casing is needed for
 * root. Computed here (configuration time), not as a helper called from inside a task's doLast, so
 * the plural aggregator tasks stay configuration-cache-safe - see the file-level comment above.
 */
static List<Map> releaseFlowTargets(Project root) {
    List<Map> targets = root.allprojects.findAll { it.pluginManager.hasPlugin('duckasteroid-release-flow') }.collect { Project p ->
        [
                module      : p.path,
                projectDir  : p.projectDir,
                tagPrefix   : p.ext.tagPrefix,
                modulePath  : p.ext.modulePath,
                typeRules   : p.extensions.getByType(CommitAnalyzerExtension).toTypeRules(),
                rcScope     : p.extensions.getByType(ChangelogExtension).rcScope.get(),
                changelogFile: p.layout.buildDirectory.file('changelog.md').get().asFile,
                pruneSuperseded: p.extensions.getByType(ReleaseCandidatesExtension).pruneSuperseded.get(),
                retain      : p.extensions.getByType(ReleaseCandidatesExtension).retain.get(),
                libsDir     : p.layout.buildDirectory.dir('libs').get().asFile,
        ]
    }
    targets.each { target ->
        target.excludedModulePaths = targets.findAll { it != target }.collect { it.modulePath as String }
    }
    return targets
}

/** Reads a bundled workflow resource (see src/main/resources/.../conventions/workflows/) as text. */
static String loadWorkflowResource(String fileName) {
    String path = "io/github/duckasteroid/conventions/workflows/${fileName}"
    InputStream stream = ManagedFileInstaller.classLoader.getResourceAsStream(path)
    if (stream == null) {
        throw new IllegalStateException("Missing bundled resource: ${path}")
    }
    stream.withStream { it.getText('UTF-8') }
}
