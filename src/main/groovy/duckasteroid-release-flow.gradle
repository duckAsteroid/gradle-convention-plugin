import io.github.duckasteroid.conventions.ChangelogExtension
import io.github.duckasteroid.conventions.ChangelogGenerator
import io.github.duckasteroid.conventions.ChangelogScope
import io.github.duckasteroid.conventions.CommitAnalyzerExtension
import io.github.duckasteroid.conventions.VersionResolver

// Opt-in release-engineering tasks for the develop -> release -> main flow described in
// VERSIONING.md at the repo root. Apply alongside duckasteroid-java, which computes
// project.ext.tagPrefix / project.ext.modulePath that these tasks reuse rather than recomputing.
//
// Four tasks total - tagReleaseCandidate/promoteReleaseCandidate are the release-time counterpart to
// duckasteroid-java's ordinary-build version resolution (they don't just *compute* a version, they
// actually create and push a tag for it); changelogForReleaseCandidate/changelogForRelease generate
// the matching release notes (see below). All four are plain Gradle tasks, runnable locally as well
// as from CI (see examples/workflows/release-candidate.yml / promote-release.yml - templates for a
// *consumer* project's own workflows, NOT live workflows in the gradle-convention-plugin repo itself,
// which can't apply its own plugins to itself - see VERSIONING.md) - release engineering shouldn't
// hard-depend on GitHub Actions being up.
//
// tagReleaseCandidate/promoteReleaseCandidate respect release.forceVersion as the ultimate backstop,
// same as the ordinary build version resolution in duckasteroid-java: if set, it's used verbatim, no
// commit analysis runs at all. This check is deliberately repeated here rather than shared with
// duckasteroid-java.gradle, so the backstop can never be silently bypassed by one call site
// forgetting to check it. See
// https://axion-release-plugin.readthedocs.io/en/latest/configuration/force_version/
// (The changelog tasks have no forceVersion equivalent - release notes are generated from whatever
// commits are actually there regardless of what version they're attached to.)
//
// Task actions below capture everything they need (tagPrefix, modulePath, projectDir, the
// forceVersion property) as plain local values during task *configuration*, and shell out via
// plain ProcessBuilder rather than project.exec at *execution* time (inside doLast) - accessing the
// live Project object from a task action at execution time is unsupported under the configuration
// cache, so nothing in a doLast block below may reference `project` directly.
//
// changelogForReleaseCandidate / changelogForRelease (see the `changelog { }` extension below)
// generate release notes but don't tag anything - deliberately separate from tagReleaseCandidate/
// promoteReleaseCandidate so notes can be previewed locally before actually cutting a release, and
// so a CI job can generate notes, then tag, in that order (changelogForReleaseCandidate must run
// BEFORE tagReleaseCandidate: it looks for the *previous* release-candidate tag reachable from HEAD,
// which would incorrectly find the *new* RC tag instead if that tag already existed by the time it
// ran).

def changelogExtension = project.extensions.create('changelog', ChangelogExtension)
changelogExtension.rcScope.convention(ChangelogScope.SINCE_LAST_RELEASE)

tasks.register('tagReleaseCandidate') {
    group = 'release'
    description = 'Tags and pushes the next release-candidate version (auto-incrementing RC number), ' +
            'derived from conventional commits since the last final release, or release.forceVersion if set.'
    def tagPrefix = project.ext.tagPrefix
    def modulePath = project.ext.modulePath
    def repoDir = project.projectDir
    def forceVersion = project.findProperty('release.forceVersion')
    // Captured now (configuration time) as a plain Map, not the live extension object - see the
    // config-cache note in the file-level comment above.
    def typeRules = project.extensions.getByType(CommitAnalyzerExtension).toTypeRules()
    doLast {
        // Same candidate computation as an ordinary build (VersionResolver.resolveCandidateVersion,
        // sharing the fallback-to-root-'v' and path-scoped commit-filtering behavior), just without
        // the -SNAPSHOT decoration - this candidate is what actually gets tagged below, not just
        // displayed. Intended to run on every push to the `release` branch: the first invocation for
        // a given candidate version mints "-RC1", subsequent ones on later commits mint "-RC2",
        // "-RC3", etc. (see VersionResolver.nextReleaseCandidateTag), with no manual version
        // bookkeeping required anywhere.
        String candidate = forceVersion ?:
                VersionResolver.resolveCandidateVersion(repoDir, tagPrefix, modulePath, ['v'], typeRules)
        String tag = VersionResolver.nextReleaseCandidateTag(repoDir, tagPrefix, candidate)
        createAndPushTag(repoDir, tag)
    }
}

tasks.register('promoteReleaseCandidate') {
    group = 'release'
    description = 'Strips the -RCx suffix off the current release candidate and tags/pushes the final ' +
            'release version, or release.forceVersion if set.'
    def tagPrefix = project.ext.tagPrefix
    def repoDir = project.projectDir
    def forceVersion = project.findProperty('release.forceVersion')
    doLast {
        // No modulePath/fallback needed here, unlike tagReleaseCandidate above: this doesn't derive
        // a version from commits at all, it just strips "-RCn" off whichever RC tag is nearest
        // reachable from HEAD (VersionResolver.promoteTag) - by the time you're promoting, that tag
        // already exists, already under this module's own tagPrefix. Intended to run on every push
        // to `main` once an accepted RC has been merged there from `release`.
        String tag = forceVersion ? "${tagPrefix}${forceVersion}" : VersionResolver.promoteTag(repoDir, tagPrefix)
        createAndPushTag(repoDir, tag)
    }
}

tasks.register('changelogForReleaseCandidate') {
    group = 'release'
    description = 'Generates release-candidate notes (Markdown, written to build/changelog.md), ' +
            'scoped by changelog.rcScope (default: everything since the last final release).'
    def tagPrefix = project.ext.tagPrefix
    def modulePath = project.ext.modulePath
    def repoDir = project.projectDir
    def typeRules = project.extensions.getByType(CommitAnalyzerExtension).toTypeRules()
    def rcScope = project.extensions.getByType(ChangelogExtension).rcScope.get()
    def outputFile = project.layout.buildDirectory.file('changelog.md').get().asFile
    doLast {
        List<String> messages = VersionResolver.commitMessagesForChangelog(repoDir, tagPrefix, modulePath, ['v'], rcScope)
        writeChangelog(outputFile, ChangelogGenerator.generate(messages, typeRules))
    }
}

tasks.register('changelogForRelease') {
    group = 'release'
    description = 'Generates final release notes (Markdown, written to build/changelog.md), covering ' +
            'everything since the last final release regardless of changelog.rcScope.'
    def tagPrefix = project.ext.tagPrefix
    def modulePath = project.ext.modulePath
    def repoDir = project.projectDir
    def typeRules = project.extensions.getByType(CommitAnalyzerExtension).toTypeRules()
    def outputFile = project.layout.buildDirectory.file('changelog.md').get().asFile
    doLast {
        List<String> messages = VersionResolver.commitMessagesForChangelog(
                repoDir, tagPrefix, modulePath, ['v'], ChangelogScope.SINCE_LAST_RELEASE)
        writeChangelog(outputFile, ChangelogGenerator.generate(messages, typeRules))
    }
}

/** Writes generated changelog Markdown to outputFile, creating parent directories as needed. */
def writeChangelog(File outputFile, String changelog) {
    outputFile.parentFile.mkdirs()
    outputFile.text = changelog
    println "Changelog written to ${outputFile}"
}

/** Creates an annotated tag at HEAD and pushes it to `origin` - the only state-mutating step here. */
def createAndPushTag(File repoDir, String tag) {
    runGit(repoDir, 'tag', '-a', tag, '-m', "Release ${tag}")
    runGit(repoDir, 'push', 'origin', tag)
}

/**
 * Plain ProcessBuilder rather than project.exec (see file-level comment above for why) or
 * VersionResolver's JGit plumbing (pushing a tag needs real push credentials - the `git` CLI
 * transparently reuses whatever's already configured, both locally and via actions/checkout's
 * persisted GITHUB_TOKEN in CI, with no extra credential wiring needed here).
 */
def runGit(File repoDir, String... args) {
    List<String> command = ['git'] + (args as List<String>)
    Process process = new ProcessBuilder(command).directory(repoDir).redirectErrorStream(true).start()
    String output = process.inputStream.getText('UTF-8')
    int exit = process.waitFor()
    if (exit != 0) {
        throw new RuntimeException("git ${args.join(' ')} failed (${exit}): ${output.trim()}")
    }
}
