# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
name: Perform a basic build and test

# CI only — this does not publish anything. Publishing is handled separately by publish.yml,
# triggered by pushing a version tag (see that file for details).
on:
  push:
    branches:
      - feature/**
      - develop
      - release
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # needed to resolve duckasteroid-java/-release-flow from GitHub Packages (dogfooding)

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          # 21, not 20: this project now applies duckasteroid-java to itself (dogfooding), which
          # sets a Java 21 toolchain via gradle.properties' duckasteroid.java.version. There's no
          # auto-download resolver configured, so Gradle needs a JDK it can already see on PATH.
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Execute Gradle build
        run: ./gradlew build
        env:
          # Resolving duckasteroid-java/-release-flow/github-packages-settings from GitHub Packages
          # at plugin-resolution time needs read credentials - tier 2 of the credential fallback
          # (GITHUB_ACTOR is already in the default Actions env; GITHUB_TOKEN has to be exported
          # explicitly).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
