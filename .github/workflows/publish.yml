# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# GitHub recommends pinning actions to a commit SHA.
# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.

# Releases are controlled entirely by git tags: push a tag matching one of the axion-release
# prefixes this repo tags with (root project => 'v', e.g. 'v1.0.0-RC1') and this workflow both
# cuts the GitHub Release and publishes the resulting version to GitHub Packages.
#
# The GitHub Release and the publish step are done in ONE job/workflow run, not as two workflows
# chained through the 'release: created' event. That's deliberate: a workflow run triggered by the
# default GITHUB_TOKEN does not trigger other workflows, so if release-creation were a separate
# workflow, this publish job would never fire. Don't split this back into two workflows unless the
# release-creation step is switched to use a personal access token instead of GITHUB_TOKEN.
name: Release and publish package to GitHub Packages
on:
  push:
    tags:
      - 'v*'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create the GitHub Release
      packages: write # needed to publish to GitHub Packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          java-version: '20'
          distribution: 'temurin'
      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v1

      # Turns the pushed tag into a visible GitHub Release with auto-generated notes.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --generate-notes

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # axion-release derives the published version from the tag that triggered this workflow.
      - name: Publish package
        uses: gradle/gradle-build-action@v2
        with:
          arguments: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
