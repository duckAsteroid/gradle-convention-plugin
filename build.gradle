plugins {
    id 'groovy-gradle-plugin'
    id 'com.gradle.plugin-publish' version '2.1.1'
    id 'com.github.ben-manes.versions' version '0.54.0'
    id 'pl.allegro.tech.build.axion-release' version '1.21.2'
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(21))
    }
}

group = 'io.github.duckasteroid.conventions'
version = scmVersion.version

System.out.println("Version=${version}")

gradlePlugin {
    vcsUrl = 'https://github.com/duckAsteroid/gradle-convention-plugin'
}

repositories {
    gradlePluginPortal() // so that external plugins can be resolved in dependencies section
}

publishing {
    repositories {
        maven {
            name = "Directory"
            // change to point to your repo, e.g. http://my.org/repo
            url = layout.buildDirectory.dir("repo")
        }
        maven {
            name = "GitHubPackages"
            url = "https://maven.pkg.github.com/duckAsteroid/gradle-convention-plugin"
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
        mavenLocal()
    }
}

dependencies {
    implementation gradleApi()
    implementation('pl.allegro.tech.build.axion-release:pl.allegro.tech.build.axion-release.gradle.plugin:1.21.2')
    implementation('com.github.ben-manes.versions:com.github.ben-manes.versions.gradle.plugin:0.54.0')
    implementation('io.freefair.lombok:io.freefair.lombok.gradle.plugin:9.5.0')
    implementation('io.github.duckasteroid.github-packages:io.github.duckasteroid.github-packages.gradle.plugin:0.1.3')

    testImplementation gradleTestKit()
    //testImplementation 'org.gradle:gradle-logging:7.6.1'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.2'
}

test {
    useJUnitPlatform();
}

tasks.named('publish') {
    dependsOn('check')
}
