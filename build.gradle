plugins {
    id 'groovy-gradle-plugin'
    id 'com.gradle.plugin-publish' version '2.1.1'
    id 'com.github.ben-manes.versions' version '0.54.0'
    id 'pl.allegro.tech.build.axion-release' version '1.21.2'
    // Dogfooding our own conventions: java toolchain (pinned back to 21 for this project via
    // gradle.properties' duckasteroid.java.version, since this repo targets a different Java
    // version than the default it hands out to consumers) and SCM-derived versioning/release-flow
    // tasks (tagReleaseCandidate, promoteReleaseCandidate, changelogFor*). Resolved from GitHub
    // Packages via the io.github.duckasteroid.github-packages-settings bootstrap in settings.gradle
    // - the same mechanism every other consumer of this plugin uses (see
    // adopt-duckasteroid-gradle-conventions skill / this repo's own README).
    id 'duckasteroid-java' version '1.1.0'
    id 'duckasteroid-release-flow' version '1.1.0'
    // Published to the Gradle Plugin Portal (unlike the duckasteroid-* plugins above), so no
    // GitHub Packages settings bootstrap is needed for these two to resolve. 3.0.0 is required -
    // 2.1.0 had both plugins registering a project extension named 'agentDocs', which collided
    // when applied together (duckAsteroid/agent-docs#3); 3.0.0 renames the publish side's
    // extension to 'agentDocsPublish', but still registers a deprecated 'agentDocs {}' alias for
    // back-compat that reclaims the name if the publish plugin applies first - so agent-docs
    // (resolve) must be declared before agent-docs.publish here. Since this project applies
    // java-gradle-plugin, agent-docs.publish auto-switches to EMBEDDED distribution and requires
    // one docs bundle per declared plugin id under src/agent-docs/<pluginId>/ - see that
    // directory for each duckasteroid-* plugin's agent-facing docs. Applying the resolve plugin
    // alongside it means running resolveAgentDocs also picks up agent-docs' own embedded
    // self-documentation (both plugins apply agent-docs.publish to themselves upstream) as local
    // skills, instead of us having to hand-write usage docs for them.
    id 'io.github.duckasteroid.agent-docs' version '3.0.0'
    id 'io.github.duckasteroid.agent-docs.publish' version '3.0.0'
}

group = 'io.github.duckasteroid.conventions'

gradlePlugin {
    vcsUrl = 'https://github.com/duckAsteroid/gradle-convention-plugin'
}

// This project IS a Gradle plugin, published via com.gradle.plugin-publish's own auto-generated
// 'pluginMaven' publication - not a plain Java library. duckasteroid-java's 'mavenJava' publication
// (from components.java) resolves to the exact same Maven coordinates (group:rootProject.name:version)
// and would race 'pluginMaven' to publish the same GAV if both ran - fine against mavenLocal/a local
// directory repo (silently overwrites, just a warning), but a hard 409 Conflict against GitHub
// Packages, which won't let a second publish overwrite a version that already landed (confirmed by
// a real CI run). Since 'pluginMaven' is the correct/authoritative one here, skip 'mavenJava'
// entirely rather than let them race.
//
// NOTE: removing the publication from publishing.publications (e.g. via
// `gradle.projectsEvaluated { publishing.publications.removeIf { ... } }`) does NOT work - the
// maven-publish plugin registers a publish task for each publication eagerly, as soon as it's added
// to the container, which happens well before gradle.projectsEvaluated fires. Removing the
// publication afterwards doesn't un-register the task that was already created for it (confirmed by
// a real CI run: the mavenJava tasks still executed and published successfully, then pluginMaven's
// publish of the same GAV failed with 409). Skipping the tasks themselves via onlyIf works regardless
// of when they were registered.
//
// Three config-cache-incompatible attempts already ruled out here (all confirmed by real CI/local
// runs): (1) implicit delegate resolution (`onlyIf { publication.name != ... }`) throws a
// MissingPropertyException on cache replay; (2) capturing the outer configureEach task as a named
// variable and referencing it from the onlyIf closure fails with "value discarded during
// serialization"; (3) even reading `.publication` on the task's OWN onlyIf parameter (no outer
// capture at all) still fails the same way - task.publication itself isn't config-cache-serializable
// for these particular gradle-plugin-marker publish tasks specifically (ordinary user-defined
// publications may differ). Matching on the task NAME instead - a plain String, trivially
// serializable - sidesteps all of that.
tasks.withType(PublishToMavenRepository).configureEach {
    onlyIf("skip the mavenJava publication - pluginMaven is authoritative here") { t ->
        !t.name.startsWith('publishMavenJavaPublicationTo')
    }
}
tasks.withType(PublishToMavenLocal).configureEach {
    onlyIf("skip the mavenJava publication - pluginMaven is authoritative here") { t ->
        !t.name.startsWith('publishMavenJavaPublicationTo')
    }
}

repositories {
    gradlePluginPortal() // so that external plugins can be resolved in dependencies section
}

publishing {
    repositories {
        maven {
            name = "Directory"
            // change to point to your repo, e.g. http://my.org/repo
            url = layout.buildDirectory.dir("repo")
        }
        maven {
            name = "GitHubPackages"
            url = "https://maven.pkg.github.com/duckAsteroid/gradle-convention-plugin"
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
        mavenLocal()
    }
}

dependencies {
    implementation gradleApi()
    implementation('pl.allegro.tech.build.axion-release:pl.allegro.tech.build.axion-release.gradle.plugin:1.21.2')
    implementation('com.github.ben-manes.versions:com.github.ben-manes.versions.gradle.plugin:0.54.0')
    implementation('io.freefair.lombok:io.freefair.lombok.gradle.plugin:9.5.0')
    implementation('io.github.duckasteroid.github-packages:io.github.duckasteroid.github-packages.gradle.plugin:0.2.0')
    // axion-release only exposes JGit on the runtime classpath, not compile - VersionResolver
    // (a plain class, not a precompiled script plugin) needs it directly to compile. Version
    // pinned to what axion-release-plugin 1.21.2 already resolves transitively, to avoid a
    // second JGit version on the classpath.
    implementation('org.eclipse.jgit:org.eclipse.jgit:7.4.0.202509020913-r')

    testImplementation gradleTestKit()
    //testImplementation 'org.gradle:gradle-logging:7.6.1'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:6.1.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.2'
}

test {
    useJUnitPlatform();
}

tasks.named('publish') {
    dependsOn('check')
}
